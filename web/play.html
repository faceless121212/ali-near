<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ali Guided Tour</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b051d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #ffffff; --soft: #f2f1f1; --card: #f8f7fa; --ink: #0b051d; --muted: #504f5f; --line: #e6e4e8;
  --pink: #ff9ecf; --pink-hover: #ff89c4; --lilac: #c9b8ff; --on-pink: #0b051d; --tile: #ffffff;
  --ok: #138a5e; --ok-soft: rgba(19, 138, 94, 0.1); --no: #d92d4c; --no-soft: rgba(217, 45, 76, 0.09);
  --vault: #0b051d; --wire: #dcd8e3; --shadow: 0 10px 30px rgba(11, 5, 29, .08);
  --font-title: "Inter Tight", -apple-system, system-ui, "Segoe UI", sans-serif;
  --font: "Inter", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0b17; --soft: #17131f; --card: #1d1828; --ink: #f6f4f9; --muted: #a8a4b5; --line: #2b2638; --tile: #241e31;
    --ok: #4cd29c; --ok-soft: rgba(76, 210, 156, 0.13); --no: #ff6b83; --no-soft: rgba(255, 107, 131, 0.13);
    --vault: #2a2140; --wire: #3b3449; --shadow: 0 10px 30px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0b17; --soft: #17131f; --card: #1d1828; --ink: #f6f4f9; --muted: #a8a4b5; --line: #2b2638; --tile: #241e31;
  --ok: #4cd29c; --ok-soft: rgba(76, 210, 156, 0.13); --no: #ff6b83; --no-soft: rgba(255, 107, 131, 0.13);
  --vault: #2a2140; --wire: #3b3449; --shadow: 0 10px 30px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--soft); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { margin: 0; font-family: var(--font-title); font-weight: 800; letter-spacing: -0.02em; }
p { margin: 0; }

.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 0 16px; height: 60px; display: flex; align-items: center; gap: 14px; }
.logo { font-family: var(--font-title); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.05em; text-decoration: none; line-height: 1; }
.logo i { font-style: normal; color: var(--pink); }
.logo small { font: 600 0.8125rem var(--font); letter-spacing: 0; color: var(--muted); margin-left: 8px; }
.top-right { margin-left: auto; display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 20px; border-radius: 99999px; border: 0; font: 600 0.95rem/1.2 var(--font); text-decoration: none; cursor: pointer; white-space: nowrap; color: var(--ink); }
.btn-line { background: transparent; border: 1px solid var(--line); }
.btn-line:hover { background: var(--card); }
.btn-ink { background: var(--ink); color: var(--bg); }
.btn-pink { background: var(--pink); color: var(--on-pink); }
.btn-pink:hover { background: var(--pink-hover); }
.btn:disabled { opacity: .5; cursor: default; }
@media (max-width: 560px) { .logo small, .hide-sm { display: none; } }

.page { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }

/* Progress */
.progress { display: flex; align-items: center; gap: 12px; }
.dots { display: flex; gap: 6px; flex: 1; }
.dots button { flex: 1; height: 8px; border-radius: 99999px; border: 0; padding: 0; background: var(--line); cursor: pointer; }
.dots button.done { background: var(--ok); opacity: .7; }
.dots button.now { background: var(--pink); }
.dots button:disabled { cursor: default; }
.count { font-size: 0.875rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Layout: story on the left, the live stage on the right */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
@media (max-width: 920px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: 28px; padding: 24px; }
.story { display: grid; gap: 16px; }
.eyebrow { font-size: 0.8125rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.eyebrow b { color: var(--ink); background: var(--lilac); padding: 2px 8px; border-radius: 99999px; margin-right: 6px; color: #0b051d; }
.story h1 { font-size: clamp(1.75rem, 3.4vw, 2.5rem); line-height: 1.08; }
.lead { font-size: 1.0625rem; color: var(--muted); }
.lead b { color: var(--ink); }
.quote { border-left: 4px solid var(--no); background: var(--no-soft); padding: 10px 14px; border-radius: 0 14px 14px 0; font: 500 0.9rem var(--mono); }
.rules { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.rules li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--card); border-radius: 14px; padding: 10px 12px; font-size: 0.9375rem; }
.rules li span:first-child { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--bg); font-size: 1.05rem; }

/* The big tappable action */
.tap { width: 100%; text-align: left; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 22px; border: 2px solid var(--pink); background: color-mix(in srgb, var(--pink) 14%, var(--bg)); color: var(--ink); cursor: pointer; transition: transform .15s, background .15s; }
.tap:hover:not(:disabled) { background: color-mix(in srgb, var(--pink) 24%, var(--bg)); transform: translateY(-1px); }
.tap:disabled { cursor: progress; opacity: .8; }
.tap img { width: 56px; height: 56px; border-radius: 16px; object-fit: cover; }
.tap strong { font-size: 1.0625rem; display: block; }
.tap small { color: var(--muted); font-size: 0.8125rem; }
.tap .go { width: 40px; height: 40px; border-radius: 50%; background: var(--pink); display: grid; place-items: center; font-weight: 800; color: #0b051d; }
.tap.pulse .go { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pink) 70%, transparent); } 50% { box-shadow: 0 0 0 10px transparent; } }

.result { border-radius: 20px; padding: 14px 16px; display: grid; gap: 6px; font-size: 0.975rem; }
.result.ok { background: var(--ok-soft); }
.result.no { background: var(--no-soft); }
.result.info { background: var(--card); }
.result .big { font-family: var(--font-title); font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; }
.result.ok .big { color: var(--ok); }
.result.no .big { color: var(--no); }
.result .learn { font-size: 0.875rem; color: var(--muted); }
.checks { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 3px; font-size: 0.875rem; }
.checks li b { display: inline-block; width: 18px; }
.checks li.ok b { color: var(--ok); } .checks li.no { color: var(--no); font-weight: 600; }
.checks em { font-style: normal; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); margin-left: 6px; }
.nav { display: flex; justify-content: space-between; gap: 8px; }

/* Stage: agent → firewall → API */
.stage { display: grid; gap: 14px; position: sticky; top: 76px; }
@media (max-width: 920px) { .stage { position: static; } }
.stage-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.stage-head h2 { font-size: 1rem; }
.live { font-size: 0.75rem; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.lane { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr) 44px minmax(0, 1fr); align-items: center; }
.node { background: var(--card); border: 2px solid transparent; border-radius: 22px; padding: 12px 10px; display: grid; justify-items: center; text-align: center; gap: 4px; min-height: 176px; align-content: start; transition: border-color .25s, background .25s, transform .25s, opacity .25s; }
.node img { width: 72px; height: 72px; border-radius: 18px; object-fit: cover; }
.node b { font-size: 0.9375rem; line-height: 1.2; }
.node span { font-size: 0.75rem; color: var(--muted); line-height: 1.3; word-break: break-word; }
.node.dim { opacity: .45; }
.node.lit { border-color: var(--pink); }
.node.ok { border-color: var(--ok); background: var(--ok-soft); }
.node.no { border-color: var(--no); background: var(--no-soft); animation: shake .4s; }
.node.bad img { filter: grayscale(.6) hue-rotate(300deg); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 4px; }
.chips i { font-style: normal; font-size: 0.6875rem; font-weight: 600; padding: 2px 7px; border-radius: 99999px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.chips i.no { border-color: var(--no); color: var(--no); }
.wire { position: relative; height: 4px; background: var(--wire); border-radius: 4px; margin: 0 4px; }
.coin { position: absolute; top: 50%; left: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pink) 35%, transparent); opacity: 0; font: 800 0.7rem var(--font); display: grid; place-items: center; color: #0b051d; }
.coin.go { animation: fly .6s ease-in-out forwards; }
@keyframes fly { 0% { left: 0; opacity: 1; } 100% { left: 100%; opacity: 1; } }
.coin.req { background: var(--lilac); box-shadow: 0 0 0 4px color-mix(in srgb, var(--lilac) 35%, transparent); }
@media (max-width: 560px) {
  .lane { grid-template-columns: minmax(0, 1fr); }
  .node { min-height: 0; grid-template-columns: 52px minmax(0, 1fr); justify-items: start; text-align: left; align-items: center; column-gap: 12px; }
  .node img { width: 52px; height: 52px; grid-row: span 3; }
  .chips { justify-content: flex-start; grid-column: 2; }
  .wire { width: 4px; height: 28px; margin: 4px auto; }
  .coin { left: 50%; top: 0; }
  @keyframes fly { 0% { top: 0; opacity: 1; } 100% { top: 100%; opacity: 1; } }
}
.bubble { background: var(--vault); color: #f9f8f5; border-radius: 18px; padding: 12px 14px; font-size: 0.9375rem; min-height: 48px; display: flex; gap: 10px; align-items: center; }
.bubble b { font-family: var(--mono); font-size: 0.8125rem; padding: 2px 8px; border-radius: 8px; background: rgba(249, 248, 245, .14); white-space: nowrap; }
.bubble.ok b { background: #4cd29c; color: #0b051d; }
.bubble.no b { background: #ff6b83; color: #0b051d; }
.wallet { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.wallet div { background: var(--card); border-radius: 16px; padding: 10px 12px; }
.wallet small { display: block; font-size: 0.75rem; color: var(--muted); }
.wallet strong { font-family: var(--font-title); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 9px; background: var(--line); overflow: hidden; margin-top: 6px; }
.meter span { display: block; height: 100%; width: 0; background: var(--pink); transition: width .4s; }
.strip { display: flex; flex-wrap: wrap; gap: 4px; }
.strip span { font: 600 0.75rem var(--mono); padding: 3px 8px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); animation: pop .2s both; }
.strip span.no { background: var(--no-soft); color: var(--no); }
.strip span.skip { background: var(--card); color: var(--muted); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
details.hood { border-top: 1px solid var(--line); padding-top: 10px; }
details.hood summary { cursor: pointer; font-size: 0.875rem; font-weight: 600; color: var(--muted); }
details.hood pre { margin: 8px 0 0; background: var(--card); border-radius: 12px; padding: 10px; font: 0.75rem/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }

/* Final chapter */
.wins { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.wins li { display: flex; gap: 10px; align-items: baseline; font-size: 1rem; }
.wins li::before { content: "✓"; color: var(--ok); font-weight: 800; }
.where { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.where a { display: grid; gap: 4px; text-decoration: none; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; transition: border-color .15s, transform .15s; }
.where a:hover { border-color: var(--pink); transform: translateY(-1px); }
.where a span { font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.where a strong { font-size: 1rem; }
.where a p { font-size: 0.875rem; color: var(--muted); }
.where a.rec { border: 2px solid var(--pink); }
@media (prefers-reduced-motion: reduce) { .coin.go, .node.no, .tap.pulse .go, .strip span { animation-duration: 1ms !important; animation-iteration-count: 1 !important; } }
</style>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="/">Ali<i>.</i><small>Guided tour</small></a>
    <div class="top-right">
      <a class="btn btn-line hide-sm" href="/app">Full playground</a>
      <a class="btn btn-line" href="/">Home</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="progress">
    <div class="dots" id="dots" aria-label="Tour progress"></div>
    <span class="count" id="count"></span>
  </div>

  <div class="grid">
    <section class="card story" id="story" aria-live="polite"></section>

    <section class="card stage" aria-label="What's happening">
      <div class="stage-head"><h2>Live view</h2><span class="live">real payments, test money</span></div>
      <div class="lane">
        <div class="node" id="n-agent"><img src="/assets/v4/step-ask.jpg" alt=""><b>Your AI agent</b><span>Acme's marketing bot</span></div>
        <div class="wire"><i class="coin" id="c1"></i></div>
        <div class="node dim" id="n-fw"><img src="/assets/v4/safe.jpg" alt=""><b>Ali firewall</b><span id="fw-sub">No budget yet</span><div class="chips" id="rules"></div></div>
        <div class="wire"><i class="coin" id="c2"></i></div>
        <div class="node" id="n-api"><img id="api-img" src="/assets/v4/api-weather.jpg" alt=""><b id="api-name">Weather API</b><span id="api-sub">0.01 USDC per call</span></div>
      </div>
      <div class="bubble" id="bubble"><b>…</b><span>Waiting for your first tap.</span></div>
      <div class="wallet">
        <div><small>Budget</small><strong id="bal">—</strong></div>
        <div><small>Spent today</small><strong id="spent">—</strong><div class="meter"><span id="meter"></span></div></div>
        <div><small>Daily limit</small><strong id="limit">—</strong></div>
      </div>
      <div class="strip" id="strip" hidden></div>
      <details class="hood" id="hood"><summary>Under the hood (for developers)</summary><pre id="hood-pre">Nothing yet.</pre></details>
    </section>
  </div>
</main>
<script type="module" src="/play.js"></script>
</body>
</html>
